<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>สื่อ-ต่อ-สาร | Domino</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:#f5f7fb;color:#18212f}
header{padding:18px;text-align:center;background:linear-gradient(135deg,#13b9c9,#7048e8);color:white}
h1{margin:0;font-size:28px}.wrap{max-width:900px;margin:auto;padding:18px}
.card{background:white;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 5px 20px #0001}
button{border:0;border-radius:12px;padding:12px 18px;font-size:16px;font-weight:700;cursor:pointer;background:#7048e8;color:white}
input{padding:12px;border:1px solid #ccd3df;border-radius:10px;font-size:16px;width:100%;margin:6px 0}
.hidden{display:none}.status{text-align:center;font-weight:700;margin:10px}
.board{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;min-height:120px}
.domino{width:190px;display:grid;grid-template-columns:1fr 1fr;background:white;border:4px solid #222;border-radius:18px;overflow:hidden;box-shadow:0 3px 8px #0002}
.half{min-height:105px;padding:8px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border-right:3px solid #222}
.half:last-child{border:0}.emoji{font-size:42px}.word{font-size:17px;font-weight:800}.en{font-size:11px;color:#555}.start{background:#fff3e8}.noise{background:#eee}
.hand{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}.hand .domino{cursor:pointer;width:175px}.hand .domino:hover{transform:translateY(-3px)}
.small{font-size:13px;color:#5d6675}.scores{display:flex;gap:8px;flex-wrap:wrap}.score{padding:8px 12px;background:#eef0ff;border-radius:10px}
</style>
</head>
<body>
<header><h1>🀄 สื่อ-ต่อ-สาร</h1><div>เกมโดมิโนกระบวนการสื่อสาร</div></header>
<div class="wrap">
<section id="setup" class="card">
<h2>เริ่มเกม</h2>
<p>ต้นแบบนี้เป็นโหมดทดลองบนเครื่องเดียวก่อน เพื่อทดสอบกติกาและหน้าตาเกม</p>
<input id="name" placeholder="ชื่อผู้เล่น">
<button onclick="startGame()">เริ่มเล่น</button>
</section>

<section id="game" class="hidden">
<div class="card">
<div class="status" id="turn"></div>
<div class="scores" id="scores"></div>
</div>
<div class="card">
<h2>กระดาน</h2><div class="board" id="board"></div>
</div>
<div class="card">
<h2>เบี้ยในมือ</h2><p class="small">กดเบี้ยที่ต้องการวาง ระบบจะตรวจสอบให้</p>
<div class="hand" id="hand"></div>
<button onclick="draw()">จั่วเบี้ยจากกองกลาง</button>
<span id="deck" class="small"></span>
</div>
</section>
</div>
<script>
const pieces=[
["ผู้ส่งสาร","การเข้ารหัส","👤","🔐"],
["การเข้ารหัส","ข่าวสาร/สื่อ","🔐","📱"],
["ข่าวสาร/สื่อ","การถอดรหัส","📱","🔓"],
["การถอดรหัส","ผู้รับสาร","🔓","👂"],
["ผู้รับสาร","การตอบสนอง","👂","💬"],
["การตอบสนอง","ผลสะท้อนกลับ","💬","🔄"],
["ผลสะท้อนกลับ","ผู้ส่งสาร","🔄","👤"],
["Noise","Noise","📡","📡"],
["Noise","ผู้ส่งสาร","📡","👤"],
["Noise","การเข้ารหัส","📡","🔐"],
["Noise","ข่าวสาร/สื่อ","📡","📱"],
["Noise","การถอดรหัส","📡","🔓"],
["Noise","ผู้รับสาร","📡","👂"],
["Noise","การตอบสนอง","📡","💬"],
["Noise","ผลสะท้อนกลับ","📡","🔄"]
];
let deck=[],hand=[],board=[],scores=[0],started=false;
const info={
"ผู้ส่งสาร":["👤","Sources"],"การเข้ารหัส":["🔐","Encoding"],"ข่าวสาร/สื่อ":["📱","Message / Media"],
"การถอดรหัส":["🔓","Decoding"],"ผู้รับสาร":["👂","Receiver"],"การตอบสนอง":["💬","Response"],"ผลสะท้อนกลับ":["🔄","Feedback"],"Noise":["📡","Noise"],"START":["🏁","START"]
};
function card(a,b,ea,eb,cls=""){
return `<div class="domino ${cls}"><div class="half">${ea?`<div class="emoji">${ea}</div>`:""}<div class="word">${a}</div><div class="en">${info[a]?.[1]||""}</div></div><div class="half">${eb?`<div class="emoji">${eb}</div>`:""}<div class="word">${b}</div><div class="en">${info[b]?.[1]||""}</div></div></div>`;
}
function startGame(){
let n=document.getElementById("name").value.trim()||"ผู้เล่น";
document.getElementById("setup").classList.add("hidden");document.getElementById("game").classList.remove("hidden");
deck=pieces.map(x=>x); board=[["START","ผู้ส่งสาร","🏁","👤"]]; hand=[
["ผู้ส่งสาร","การเข้ารหัส","👤","🔐"],["การเข้ารหัส","ข่าวสาร/สื่อ","🔐","📱"],
["Noise","Noise","📡","📡"],["ผู้รับสาร","การตอบสนอง","👂","💬"],["ผลสะท้อนกลับ","ผู้ส่งสาร","🔄","👤"]
]; started=true; render();
}
function render(){
document.getElementById("turn").textContent="ตาของ "+(document.getElementById("name").value||"ผู้เล่น")+" — ต้องต่อด้านที่เป็น “ผู้ส่งสาร”";
document.getElementById("scores").innerHTML=`<div class="score">คะแนน: ${scores[0]}</div>`;
document.getElementById("board").innerHTML=board.map(x=>card(x[0],x[1],x[2],x[3],x[0]=="START"?"start":"")).join("");
document.getElementById("hand").innerHTML=hand.map((x,i)=>`<div onclick="play(${i})">${card(...x,x[0]=="Noise"?"noise":"")}</div>`).join("");
document.getElementById("deck").textContent=`กองกลาง: ${Math.max(0,deck.length-hand.length)} เบี้ย`;
}
function play(i){
let p=hand[i], end=board[board.length-1][1];
if(p[0]!==end && !(end==="Noise" && p[0]==="Noise")){
alert("ยังต่อเบี้ยนี้ไม่ได้ ต้องหาเบี้ยที่ตรงกับด้านปลายแถว");return;
}
board.push(p);hand.splice(i,1);scores[0]+=10;
if(p[1]==="ผู้ส่งสาร") scores[0]+=20;
if(hand.length===0) alert("🎉 คุณชนะ! เบี้ยหมดมือแล้ว");
render();
}
function draw(){
if(deck.length){let p=deck.shift();hand.push(p);render()}else alert("กองกลางหมดแล้ว");
}
</script>
</body></html>
